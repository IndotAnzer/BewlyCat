name: Build Safari App

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: safari-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      needed: ${{ steps.latest.outputs.needed }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(gh api repos/keleus/BewlyCat/releases/latest --jq .tag_name)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "safari-$version" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  build-safari:
    needs: release
    if: needs.release.outputs.needed == 'true'
    name: Build unsigned Safari app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: keleus/BewlyCat
          ref: ${{ needs.release.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm and dependencies
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - args: [--frozen-lockfile]

      - name: Build Safari extension files
        run: pnpm build-safari

      - name: Create the Xcode project
        shell: bash
        run: |
          set -euo pipefail

          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            packager=safari-web-extension-packager
          else
            packager=safari-web-extension-converter
          fi

          xcrun "$packager" ./extension-safari \
            --project-location ./extension-safari-macos \
            --app-name BewlyCat \
            --bundle-identifier com.keleus.BewlyCat \
            --swift \
            --macos-only \
            --copy-resources \
            --no-open \
            --no-prompt \
            --force

      - name: Build the unsigned macOS app
        shell: bash
        run: |
          set -euo pipefail

          project_path="$(find extension-safari-macos -name '*.xcodeproj' -print -quit)"
          if [[ -z "$project_path" ]]; then
            echo "No generated Xcode project was found." >&2
            exit 1
          fi

          scheme="$(xcodebuild -project "$project_path" -list -json | jq -er '.project.schemes[0]')"
          xcodebuild \
            -project "$project_path" \
            -scheme "$scheme" \
            -configuration Release \
            -derivedDataPath "$PWD/build-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Package the app
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          app_path="$(find build-data/Build/Products/Release -name 'BewlyCat.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "BewlyCat.app was not produced." >&2
            find build-data/Build/Products -maxdepth 4 -print >&2 || true
            exit 1
          fi

          for bundle in "$app_path" "$app_path/Contents/PlugIns/BewlyCat Extension.appex"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION#v}" "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION#v}" "$bundle/Contents/Info.plist"
          done
          entitlements=$(find extension-safari-macos -name '*.entitlements' -print -quit)
          test -n "$entitlements"
          codesign --force --deep --sign - "$app_path"
          codesign --force --sign - --entitlements "$entitlements" "$app_path/Contents/PlugIns/BewlyCat Extension.appex"
          codesign --force --sign - --entitlements "$entitlements" "$app_path"
          codesign --verify --deep --strict "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" BewlyCat-Safari-macOS.zip
          shasum -a 256 BewlyCat-Safari-macOS.zip > BewlyCat-Safari-macOS.zip.sha256

      - name: Publish stable Safari release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          gh release create "safari-$VERSION" --repo "$REPOSITORY" --target "$BUILD_COMMIT" \
            --title "BewlyCat Safari $VERSION" \
            --notes "Built from the official keleus/BewlyCat release $VERSION. ARM64 macOS, ad-hoc signed for personal use." \
            BewlyCat-Safari-macOS.zip BewlyCat-Safari-macOS.zip.sha256

      - name: Upload BewlyCat app
        uses: actions/upload-artifact@v4
        with:
          name: BewlyCat-Safari-macOS
          path: BewlyCat-Safari-macOS.zip
          if-no-files-found: error
          retention-days: 7
